{% extends 'spaap/base.html' %}

{% block title %}Iniciar Sesión - Nail Spa{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white">
            
            <!-- Encabezado de la Tarjeta -->
            <div class="text-center mb-4">
                <div class="mb-2" style="font-size: 2.5rem;">✨</div>
                <h2 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;">Iniciar Sesión</h2>
                <p class="text-muted small">Ingresa tus datos para acceder al Spa.</p>
            </div>

            <!-- 🚨 MOSTRAR MENSAJES DE INTENTOS / ERRORES DE DJANGO -->
            {% if messages %}
                <div class="mb-3">
                    {% for message in messages %}
                        <div class="alert alert-danger text-center small py-2 mb-1 shadow-sm rounded-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- Formulario de Login -->
            <form method="POST">
    {% csrf_token %} <!-- ¡Esta línea es la que previene el error 403! -->
    
    <div class="mb-3">
        <label for="id_username" class="form-label fw-semibold small text-secondary">Usuario</label>
        <input type="text" name="username" id="id_username" class="form-control rounded-3 py-2" placeholder="Tu nombre de usuario" required>
    </div>

    <div class="mb-4">
        <label for="id_password" class="form-label fw-semibold small text-secondary">Contraseña</label>
        <input type="password" name="password" id="id_password" class="form-control rounded-3 py-2" placeholder="••••••••" required>
    </div>

    <div class="d-grid mb-3">
        <button type="submit" class="btn text-white fw-semibold py-2 rounded-pill shadow-sm" style="background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); border: none;">
            Entrar al Sistema
        </button>
    </div>
</form>

        </div>
    </div>
</div>
{% endblock %}
